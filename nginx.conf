pid /tmp/nginx-ex378.pid;
error_log /tmp/nginx-ex378-error.log;

events {
    worker_connections 128;
}

http {
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-ex378-access.log;
    client_body_temp_path /tmp/nginx-ex378-body;
    proxy_temp_path /tmp/nginx-ex378-proxy;
    fastcgi_temp_path /tmp/nginx-ex378-fastcgi;
    uwsgi_temp_path /tmp/nginx-ex378-uwsgi;
    scgi_temp_path /tmp/nginx-ex378-scgi;

    server {
        listen 8888;
        server_name localhost;
        charset utf-8;

        root "/home/carlos/Documentos/Estudio Quarkus/webapp-estudio-ex378";
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
